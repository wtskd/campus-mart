# ============================================================
# CampusMart 全栈编排（基础设施 + 6 个后端服务）
#   1) 宿主机先构建 jar： mvn -DskipTests clean package
#   2) 准备 .env（可选，用于注入 AI Key 与 JWT 密钥）
#   3) docker compose up -d
#   4) 前端单独起：cd campus-admin-web && npm i && npm run dev
# 说明：前端不放进 compose，便于开发调试；生产可用 nginx 镜像托管 dist。
# ============================================================
name: campus-mart

x-service-env: &service-env
  TZ: Asia/Shanghai
  NACOS_ADDR: nacos:8848
  NACOS_USERNAME: nacos
  NACOS_PASSWORD: nacos
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_USER: root
  MYSQL_PASSWORD: "123456"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_SECRET: ${JWT_SECRET:-CampusMart@2026#JwtSecretKeyForDemoOnly!}
  AI_PROVIDER: ${AI_PROVIDER:-remote}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.deepseek.com/v1}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-deepseek-chat}
  UPLOAD_PATH: /app/upload

services:
  mysql:
    image: mysql:8.0
    container_name: cm-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
      - --lower-case-table-names=1
    ports: ["3306:3306"]
    volumes:
      - cm-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - cm-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: cm-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports: ["8848:8848", "9848:9848"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8848/nacos"]
      interval: 10s
      timeout: 5s
      retries: 30

  campus-system:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args: { JAR: campus-modules/campus-system/target/campus-system-1.0.0.jar }
    image: campus/system:1.0.0
    container_name: cm-system
    restart: unless-stopped
    environment: *service-env
    ports: ["9201:9201"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  campus-item:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args: { JAR: campus-modules/campus-item/target/campus-item-1.0.0.jar }
    image: campus/item:1.0.0
    container_name: cm-item
    restart: unless-stopped
    environment: *service-env
    ports: ["9202:9202"]
    volumes:
      - ./upload:/app/upload
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  campus-analysis:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args: { JAR: campus-modules/campus-analysis/target/campus-analysis-1.0.0.jar }
    image: campus/analysis:1.0.0
    container_name: cm-analysis
    restart: unless-stopped
    environment: *service-env
    ports: ["9203:9203"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  campus-ai:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args: { JAR: campus-modules/campus-ai/target/campus-ai-1.0.0.jar }
    image: campus/ai:1.0.0
    container_name: cm-ai
    restart: unless-stopped
    environment: *service-env
    ports: ["9204:9204"]
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  campus-auth:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args: { JAR: campus-auth/target/campus-auth-1.0.0.jar }
    image: campus/auth:1.0.0
    container_name: cm-auth
    restart: unless-stopped
    environment: *service-env
    ports: ["9200:9200"]
    depends_on:
      redis: { condition: service_healthy }
      nacos: { condition: service_healthy }

  campus-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
      args: { JAR: campus-gateway/target/campus-gateway-1.0.0.jar }
    image: campus/gateway:1.0.0
    container_name: cm-gateway
    restart: unless-stopped
    environment: *service-env
    ports: ["8081:8081"]
    depends_on:
      nacos: { condition: service_healthy }
      redis: { condition: service_healthy }
      campus-auth: { condition: service_started }

volumes:
  cm-mysql-data:
  cm-redis-data:
